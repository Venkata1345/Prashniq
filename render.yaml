# Render blueprint: deploy with "New +" -> "Blueprint" pointing at this repo.
# Set the secret env vars in the Render dashboard; they are never committed.
services:
  - type: web
    name: prashniq
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: SEED_KNOWLEDGE_BASE
        value: "false" # chunks are migrated once, not re-seeded per boot
      - key: GROQ_API_KEY
        sync: false # set in dashboard
      - key: OPENAI_API_KEY
        sync: false # set in dashboard (embeddings only)
      - key: DATABASE_URL
        sync: false # Neon connection string, set in dashboard
