# Alembic configuration. `script_location` and `sqlalchemy.url` are set
# programmatically by app/db/migrate.py; the values here are fallbacks for
# running the CLI by hand:
#
#   .venv/Scripts/alembic upgrade head          (reads DATABASE_URL)
#   .venv/Scripts/alembic revision -m "..."
[alembic]
script_location = migrations
# Overridden by DATABASE_URL (see migrations/env.py) or migrate.py.
sqlalchemy.url = postgresql+asyncpg://interview:interview@localhost:5432/interview

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
